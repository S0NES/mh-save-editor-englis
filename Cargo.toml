[package]
name = "mhrise-save-editor"
version = "0.3.0"
edition = "2024"
rust-version = "1.88"
description = "Free Steam save editor for Monster Hunter Rise: Sunbreak and Monster Hunter: World (Iceborne): edit Zenny, ranks, research points, Item Box and loadouts."
license = "MIT"
readme = "README.md"
keywords = ["monster-hunter-rise", "monster-hunter-world", "iceborne", "save-editor", "steam"]
categories = ["command-line-utilities"]
default-run = "mhrise-save-editor"

[dependencies]
anyhow = "1.0"
aes = "0.9"
bitflags = "2.9"
cbc = "0.2"
clap = { version = "4.5", features = ["derive"] }
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
hex-literal = "1.0"
image = { version = "0.25", default-features = false, features = ["png"] }
murmur3 = "0.5"
num-bigint = "0.4"
num-integer = "0.1"
rand = "0.10"
rfd = "0.15"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha3 = "0.11"
thiserror = "2.0"
time = { version = "0.3", features = ["local-offset"] }
blowfish = "0.10"
sha1 = "0.11"
byteorder = "1"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3"
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
